    :root{--ink:#0b0a08;--cream:#f4ecdd;--cream-dim:rgba(244,236,221,.6);--red:#e8102e;--hair:rgba(244,236,221,.14)}
    *{margin:0;padding:0;box-sizing:border-box}

    p{color:var(--cream-dim);max-width:44ch;margin:0 auto 2.4rem;line-height:1.6}
    .row{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
    .btn{font-weight:600;font-size:.7rem;letter-spacing:.3em;padding:1.1rem 2.2rem;display:inline-block;transition:background .3s,color .3s}
    .red{background:var(--red)}.red:hover{background:var(--cream);color:var(--ink)}
    .ghost{border:1px solid rgba(244,236,221,.4)}.ghost:hover{background:var(--cream);color:var(--ink)}
    footer{padding:1.6rem 2rem;border-top:1px solid var(--hair);font-size:.6rem;letter-spacing:.28em;color:var(--cream-dim);text-align:center}
    @media(max-width:640px){nav{padding:1.1rem 1.2rem}nav .links{gap:.9rem}nav .links a{font-size:.6rem;letter-spacing:.14em}}
